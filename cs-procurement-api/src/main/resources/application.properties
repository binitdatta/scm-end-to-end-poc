# =============================================================================
# cs-procurement-api — application.properties
# =============================================================================

spring.application.name=cs-procurement-api
server.port=8083

# ── MySQL 8 DataSource ────────────────────────────────────────────────────────
# Connects as procurement_app (SELECT/INSERT/UPDATE/DELETE only — no DDL)
spring.datasource.url=jdbc:mysql://localhost:3306/cs_procurement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=localroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=ProcurementHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# CRITICAL: ddl-auto=none — schema managed via db/01_ddl_cs_procurement.sql only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Exchange and routing keys
procurement.rabbitmq.exchange=erp.topic.exchange
procurement.rabbitmq.routing-key.po-created=erp.procurement.po.created
procurement.rabbitmq.routing-key.po-approved=erp.procurement.po.approved
procurement.rabbitmq.routing-key.po-sent=erp.procurement.po.sent
procurement.rabbitmq.routing-key.po-acknowledged=erp.procurement.po.acknowledged
procurement.rabbitmq.routing-key.po-in-production=erp.procurement.po.in-production
procurement.rabbitmq.routing-key.po-ready-to-ship=erp.procurement.po.ready-to-ship
procurement.rabbitmq.routing-key.po-completed=erp.procurement.po.completed
procurement.rabbitmq.routing-key.po-cancelled=erp.procurement.po.cancelled
procurement.rabbitmq.routing-key.invoice-received=erp.procurement.invoice.received
procurement.rabbitmq.routing-key.invoice-approved=erp.procurement.invoice.approved
procurement.rabbitmq.routing-key.invoice-paid=erp.procurement.invoice.paid

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.csprocurement=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG
