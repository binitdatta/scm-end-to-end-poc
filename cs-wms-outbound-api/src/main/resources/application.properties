# =============================================================================
# cs-wms-outbound-api — application.properties
# =============================================================================

spring.application.name=cs-wms-outbound-api
server.port=8086

# ── MySQL 8 DataSource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/cs_wms_outbound?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=wms_outbound_app
spring.datasource.password=WmsOutbound#2025!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=WmsOutboundHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# CRITICAL: ddl-auto=none — schema managed via db/01_ddl_cs_wms_outbound.sql only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Exchange and routing keys
wms.outbound.rabbitmq.exchange=erp.topic.exchange
wms.outbound.rabbitmq.routing-key.wave-created=erp.wms.outbound.wave.created
wms.outbound.rabbitmq.routing-key.wave-completed=erp.wms.outbound.wave.completed
wms.outbound.rabbitmq.routing-key.shipment-created=erp.wms.outbound.shipment.created
wms.outbound.rabbitmq.routing-key.shipment-packed=erp.wms.outbound.shipment.packed
wms.outbound.rabbitmq.routing-key.shipment-manifested=erp.wms.outbound.shipment.manifested
wms.outbound.rabbitmq.routing-key.shipment-dispatched=erp.wms.outbound.shipment.dispatched

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.cswmsoutbound=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/scm-poc
