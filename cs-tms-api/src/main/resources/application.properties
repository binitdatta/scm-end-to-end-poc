# =============================================================================
# cs-tms-api — application.properties
# =============================================================================

spring.application.name=cs-tms-api
server.port=8087

# ── MySQL 8 DataSource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/cs_tms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=tms_app
spring.datasource.password=TmsApp#2025!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=TmsHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# CRITICAL: ddl-auto=none — schema managed via db/01_ddl_cs_tms.sql only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Exchange and routing keys
tms.rabbitmq.exchange=erp.topic.exchange
tms.rabbitmq.routing-key.load-created=erp.tms.load.created
tms.rabbitmq.routing-key.load-assigned=erp.tms.load.assigned
tms.rabbitmq.routing-key.load-in-transit=erp.tms.load.in-transit
tms.rabbitmq.routing-key.load-completed=erp.tms.load.completed
tms.rabbitmq.routing-key.delivery-out-for-delivery=erp.tms.delivery.out-for-delivery
tms.rabbitmq.routing-key.delivery-pod-confirmed=erp.tms.delivery.pod-confirmed

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.cstms=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG
