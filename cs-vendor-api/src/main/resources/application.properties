# =============================================================================
# cs-vendor-api — application.properties
# =============================================================================

spring.application.name=cs-vendor-api
server.port=8082

# ── MySQL 8 DataSource ────────────────────────────────────────────────────────
# Connects as vendor_app (SELECT/INSERT/UPDATE/DELETE only — no DDL)
spring.datasource.url=jdbc:mysql://localhost:3306/cs_vendor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=localroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.pool-name=VendorHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# CRITICAL: ddl-auto=none — schema is managed via db/01_ddl_cs_vendor.sql only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Exchange and routing key constants (read by RabbitMQConfig.java)
vendor.rabbitmq.exchange=erp.topic.exchange
vendor.rabbitmq.routing-key.rfq-opened=erp.vendor.rfq.opened
vendor.rabbitmq.routing-key.rfq-awarded=erp.vendor.rfq.awarded
vendor.rabbitmq.routing-key.rfq-cancelled=erp.vendor.rfq.cancelled
vendor.rabbitmq.routing-key.quote-submitted=erp.vendor.quote.submitted
vendor.rabbitmq.routing-key.vendor-created=erp.vendor.vendor.created

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.csvendor=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG
