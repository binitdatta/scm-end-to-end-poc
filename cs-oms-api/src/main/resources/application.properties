# =============================================================================
# cs-oms-api — application.properties
# =============================================================================

spring.application.name=cs-oms-api
server.port=8085

# ── MySQL 8 DataSource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/cs_oms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=oms_app
spring.datasource.password=OmsApp#2025!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=OmsHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# CRITICAL: ddl-auto=none — schema managed via db/01_ddl_cs_oms.sql only
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Exchange and routing keys (publisher)
oms.rabbitmq.exchange=erp.topic.exchange
oms.rabbitmq.routing-key.order-created=erp.oms.store-order.created
oms.rabbitmq.routing-key.order-submitted=erp.oms.store-order.submitted
oms.rabbitmq.routing-key.order-allocated=erp.oms.store-order.allocated
oms.rabbitmq.routing-key.order-picking=erp.oms.store-order.picking
oms.rabbitmq.routing-key.order-shipped=erp.oms.store-order.shipped
oms.rabbitmq.routing-key.order-delivered=erp.oms.store-order.delivered
oms.rabbitmq.routing-key.order-cancelled=erp.oms.store-order.cancelled
oms.rabbitmq.routing-key.inventory-updated=erp.oms.inventory.updated

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.csoms=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG
