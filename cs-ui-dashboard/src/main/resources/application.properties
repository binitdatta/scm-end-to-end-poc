# =============================================================================
# cs-ui-dashboard — application.properties
# =============================================================================

spring.application.name=cs-ui-dashboard
server.port=8090

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Downstream service base URLs ──────────────────────────────────────────────
services.crm.url=http://localhost:8081
services.vendor.url=http://localhost:8082
services.procurement.url=http://localhost:8083
services.wms-inbound.url=http://localhost:8084
services.oms.url=http://localhost:8085
services.wms-outbound.url=http://localhost:8086
services.tms.url=http://localhost:8087

# ── WebClient timeout ─────────────────────────────────────────────────────────
services.timeout-seconds=10

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.csui=DEBUG
spring.security.oauth2.client.registration.keycloak.client-id=scm-ui-dashboard
spring.security.oauth2.client.registration.keycloak.client-secret=scm-ui-dashboard-secret-2025
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/scm-poc
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
