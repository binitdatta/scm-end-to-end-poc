<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{partials/layout :: layout(~{::content}, ~{::script})}">
<body>
<th:block th:fragment="content">
<div class="page-header">
    <h4><i class="bi bi-box-arrow-in-down me-2 text-primary"></i>WMS Inbound — ASN, Receiving & Putaway</h4>
    <p>Track shipments from vendor dispatch through warehouse putaway. Port 8084</p>
</div>

<div class="row g-4">
    <!-- ASN table -->
    <div class="col-12 col-xl-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-clipboard-data"></i>Advance Shipment Notices</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadAsns()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive"><div id="asnTable"></div></div>
            </div>
        </div>

        <!-- Inventory table -->
        <div class="card mt-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-boxes"></i>Inventory by Campaign (SUMMER25-TOY)</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadInventory()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive"><div id="inventoryTable"></div></div>
            </div>
        </div>
    </div>

    <!-- Right: ASN lifecycle -->
    <div class="col-12 col-xl-4">
        <!-- Create ASN -->
        <div class="card mb-3">
            <div class="card-header"><i class="bi bi-plus-circle"></i>Create ASN</div>
            <div class="card-body">
                <div class="mb-2"><label class="form-label">ASN Number *</label>
                    <input class="form-control" id="asn_num" placeholder="ASN-2025-004"/></div>
                <div class="mb-2"><label class="form-label">PO External ID *</label>
                    <input class="form-control" id="asn_po" placeholder="po-001-uuid"/></div>
                <div class="mb-2"><label class="form-label">PO Number *</label>
                    <input class="form-control" id="asn_po_num" placeholder="PO-2025-001"/></div>
                <div class="mb-2"><label class="form-label">Campaign Code</label>
                    <input class="form-control" id="asn_camp" value="SUMMER25-TOY"/></div>
                <div class="mb-2"><label class="form-label">SKU</label>
                    <input class="form-control" id="asn_sku" value="TOY-DINO-MIX-001"/></div>
                <div class="mb-2"><label class="form-label">Expected Qty</label>
                    <input type="number" class="form-control" id="asn_qty" placeholder="500000"/></div>
                <div class="mb-2"><label class="form-label">Carrier</label>
                    <input class="form-control" id="asn_carrier" placeholder="OOCL Shipping"/></div>
                <div class="mb-3"><label class="form-label">ETA Date</label>
                    <input type="date" class="form-control" id="asn_eta"/></div>
                <button class="btn btn-primary w-100" onclick="createAsn()">
                    <i class="bi bi-plus-circle me-1"></i>Create ASN
                </button>
            </div>
        </div>

        <!-- ASN Lifecycle -->
        <div class="card">
            <div class="card-header"><i class="bi bi-play-circle"></i>ASN Lifecycle</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">ASN External ID</label>
                    <input class="form-control" id="asn_action_id" placeholder="asn-001-uuid"/>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-secondary btn-sm" onclick="asnAction('schedule')">
                        <i class="bi bi-calendar-check me-1"></i>Schedule Dock
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="asnAction('in-transit')">
                        <i class="bi bi-ship me-1"></i>Mark In Transit
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="asnAction('arrived')">
                        <i class="bi bi-geo-alt me-1"></i>Mark Arrived
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="receiveAsn()">
                        <i class="bi bi-box-arrow-in-down me-1"></i>Receive Shipment
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="putawayAsn()">
                        <i class="bi bi-boxes me-1"></i>Complete Putaway → OMS event
                    </button>
                </div>
                <hr class="section-divider"/>
                <div class="mb-2"><label class="form-label">Receive Qty (for receive action)</label>
                    <input type="number" class="form-control" id="asn_rcv_qty" placeholder="499800"/></div>
                <div class="mb-2"><label class="form-label">Putaway Bin 1</label>
                    <input class="form-control" id="asn_bin1" value="BIN-A-01-001"/></div>
                <div class="mb-2"><label class="form-label">Bin 1 Qty</label>
                    <input type="number" class="form-control" id="asn_bin1_qty" placeholder="250000"/></div>
                <div class="mb-2"><label class="form-label">Putaway Bin 2</label>
                    <input class="form-control" id="asn_bin2" value="BIN-A-02-001"/></div>
                <div class="mb-2"><label class="form-label">Bin 2 Qty</label>
                    <input type="number" class="form-control" id="asn_bin2_qty" placeholder="249800"/></div>
            </div>
        </div>
    </div>
</div>
</th:block>
<script th:fragment="script">
document.addEventListener('DOMContentLoaded', ()=>{ loadAsns(); loadInventory(); });

function renderAsns(data) {
    if (!data.length) return emptyState('clipboard-data','No ASNs found');
    return `<table class="table table-hover mb-0"><thead><tr>
        <th>ASN #</th><th>PO</th><th>Vendor</th><th>SKU</th><th>Expected</th><th>Status</th><th>ETA</th><th>Actions</th>
    </tr></thead><tbody>${data.map(a=>`<tr>
        <td>${mono(a.asnNumber)}</td>
        <td class="text-muted-sm">${a.poNumber||'—'}</td>
        <td class="text-muted-sm">${a.vendorCode||'—'}</td>
        <td>${mono(a.sku||'—')}</td>
        <td>${fmtNum(a.expectedQuantity)}</td>
        <td>${statusBadge(a.status)}</td>
        <td>${fmtDate(a.estimatedArrivalDate)}</td>
        <td><button class="btn btn-action btn-outline-secondary" onclick="document.getElementById('asn_action_id').value='${a.externalId}'">
            <i class="bi bi-arrow-right-circle"></i>
        </button></td>
    </tr>`).join('')}</tbody></table>`;
}

function renderInventory(data) {
    if (!data.length) return emptyState('boxes','No inventory');
    return `<table class="table mb-0"><thead><tr>
        <th>SKU</th><th>Zone</th><th>Bin</th><th>On Hand</th><th>Reserved</th><th>Available</th>
    </tr></thead><tbody>${data.map(i=>`<tr>
        <td>${mono(i.sku)}</td>
        <td>${i.warehouseZone||'—'}</td>
        <td>${mono(i.warehouseBin||'—')}</td>
        <td class="text-warning">${fmtNum(i.quantityOnHand)}</td>
        <td class="text-info">${fmtNum(i.quantityReserved)}</td>
        <td class="text-success">${fmtNum(i.quantityAvailable)}</td>
    </tr>`).join('')}</tbody></table>`;
}

async function loadAsns()      { await loadTable('wms-inbound','/api/v1/asns','asnTable',renderAsns); }
async function loadInventory() { await loadTable('wms-inbound','/api/v1/inventory/campaign/SUMMER25-TOY','inventoryTable',renderInventory); }

async function createAsn() {
    const body = {
        asnNumber: document.getElementById('asn_num').value,
        poExternalId: document.getElementById('asn_po').value,
        poNumber: document.getElementById('asn_po_num').value,
        campaignExternalId:'camp-001-uuid',
        campaignCode: document.getElementById('asn_camp').value,
        vendorExternalId:'vnd-002-uuid',vendorCode:'VND-VN-001',vendorName:'Test Vendor',vendorCountry:'VIETNAM',
        sku: document.getElementById('asn_sku').value,
        toyDescription:'Toy Item',
        expectedQuantity: parseInt(document.getElementById('asn_qty').value)||1,
        carrierName: document.getElementById('asn_carrier').value,
        estimatedArrivalDate: document.getElementById('asn_eta').value||'2025-05-05',
        createdBy:'wms.inbound.coordinator'
    };
    const res = await apiPost('wms-inbound','/api/v1/asns',body);
    showResponse('Create ASN',res);
    if(res?.success){showToast('ASN created!');loadAsns();}else showToast(res?.message||'Error',true);
}

async function asnAction(action) {
    const id = document.getElementById('asn_action_id').value.trim();
    if(!id){showToast('Enter ASN externalId',true);return;}
    const res = await apiPost('wms-inbound',`/api/v1/asns/${id}/${action}`,{triggeredBy:'wms.coordinator'});
    showResponse(`ASN ${action}`,res);
    if(res?.success){showToast(`ASN ${action} done!`);loadAsns();}else showToast(res?.message||'Error',true);
}

async function receiveAsn() {
    const id  = document.getElementById('asn_action_id').value.trim();
    const qty = parseInt(document.getElementById('asn_rcv_qty').value)||499800;
    if(!id){showToast('Enter ASN externalId',true);return;}
    const res = await apiPost('wms-inbound',`/api/v1/asns/${id}/receive`,{
        receivedQuantity:qty,damagedQuantity:0,rejectedQuantity:0,receivedBy:'warehouse.receiver.01',qcPassed:true
    });
    showResponse('Receive Shipment',res);
    if(res?.success){showToast('Shipment received!');loadAsns();}else showToast(res?.message||'Error',true);
}

async function putawayAsn() {
    const id   = document.getElementById('asn_action_id').value.trim();
    const bin1 = document.getElementById('asn_bin1').value;
    const q1   = parseInt(document.getElementById('asn_bin1_qty').value)||250000;
    const bin2 = document.getElementById('asn_bin2').value;
    const q2   = parseInt(document.getElementById('asn_bin2_qty').value)||249800;
    if(!id){showToast('Enter ASN externalId',true);return;}
    const res = await apiPost('wms-inbound',`/api/v1/asns/${id}/putaway`,{
        completedBy:'forklift.op.01',
        binAllocations:[
            {warehouseZone:'ZONE-A',warehouseAisle:'A-01',warehouseBin:bin1,quantity:q1},
            {warehouseZone:'ZONE-A',warehouseAisle:'A-02',warehouseBin:bin2,quantity:q2}
        ]
    });
    showResponse('Complete Putaway → erp.wms.inbound.putaway.completed',res);
    if(res?.success){showToast('Putaway complete! OMS event published.');loadAsns();loadInventory();}
    else showToast(res?.message||'Error',true);
}
</script>
</body>
</html>
