# =============================================================================
# cs-wms-inbound-api — application.properties
# =============================================================================

spring.application.name=cs-wms-inbound-api
server.port=8084

# ── MySQL 8 DataSource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/cs_wms_inbound?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=localroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=WmsInboundHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Exchange and routing keys (publisher)
wms.inbound.rabbitmq.exchange=erp.topic.exchange
wms.inbound.rabbitmq.routing-key.asn-created=erp.wms.inbound.asn.created
wms.inbound.rabbitmq.routing-key.asn-scheduled=erp.wms.inbound.asn.scheduled
wms.inbound.rabbitmq.routing-key.shipment-arrived=erp.wms.inbound.shipment.arrived
wms.inbound.rabbitmq.routing-key.receiving-completed=erp.wms.inbound.receiving.completed
wms.inbound.rabbitmq.routing-key.putaway-completed=erp.wms.inbound.putaway.completed

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.cswmsinbound=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG
