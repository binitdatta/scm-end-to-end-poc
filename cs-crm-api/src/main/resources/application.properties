# =============================================================================
# cs-crm-api — application.properties
# =============================================================================

spring.application.name=cs-crm-api
server.port=8081

# ── MySQL 8 DataSource ────────────────────────────────────────────────────────
# Connect as crm_app (no DDL privileges — schema managed via SQL scripts only)
spring.datasource.url=jdbc:mysql://localhost:3306/cs_crm
spring.datasource.username=root
spring.datasource.password=localroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=CrmHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# CRITICAL: ddl-auto=none — the app NEVER touches the schema.
# All DDL lives in db/01_ddl_cs_crm.sql and is run manually in MySQL Workbench.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Exchange / routing key constants (read by RabbitMQConfig.java)
crm.rabbitmq.exchange=erp.topic.exchange
crm.rabbitmq.routing-key.campaign-launched=erp.crm.campaign.launched
crm.rabbitmq.routing-key.campaign-paused=erp.crm.campaign.paused
crm.rabbitmq.routing-key.campaign-completed=erp.crm.campaign.completed
crm.rabbitmq.routing-key.customer-created=erp.crm.customer.created

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.enterprise.cscrm=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG
# =============================================================================
# KEYCLOAK SECURITY ADDITIONS — append to existing application.properties
# Service : cs-crm-api  (port 8081)
# =============================================================================

# ── OAuth2 Resource Server (Bearer JWT validation) ────────────────────────────
# Keycloak runs on port 8080; app runs on port 8081 — no conflict.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/scm-poc

# JWK Set URI (used by Spring to fetch Keycloak's public keys for JWT verification)
# Spring auto-derives this from issuer-uri; set explicitly if you see startup delays.
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/scm-poc/protocol/openid-connect/certs

# ── Actuator — keep health/info permit-all working ───────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging (optional — helpful during initial integration) ──────────────────
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
