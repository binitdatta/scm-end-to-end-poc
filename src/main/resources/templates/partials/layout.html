<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} + ' — Burger Bliss ERP'">Burger Bliss ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        :root{--bs-body-bg:#0d1117;--bs-body-color:#e6edf3}
        body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif}
        .navbar{background:#161b22!important;border-bottom:1px solid #30363d}
        .navbar-brand{font-weight:700;font-size:1.1rem;color:#58a6ff!important;letter-spacing:.03em}
        .nav-link{color:#8b949e!important;font-size:.85rem;padding:.45rem .75rem!important;border-radius:6px;transition:all .15s}
        .nav-link:hover,.nav-link.active{color:#e6edf3!important;background:#21262d}
        .nav-link .badge{font-size:.65rem;vertical-align:middle}
        .card{background:#161b22;border:1px solid #30363d;border-radius:8px}
        .card-header{background:#1c2128;border-bottom:1px solid #30363d;font-weight:600;font-size:.875rem}
        .card-header .bi{margin-right:.4rem}
        .table{color:#e6edf3;font-size:.8rem}
        .table thead th{background:#1c2128;color:#8b949e;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;border-color:#30363d}
        .table tbody tr{border-color:#21262d}
        .table tbody tr:hover{background:#1c2128}
        .table td,.table th{vertical-align:middle}
        .form-control,.form-select{background:#0d1117;border:1px solid #30363d;color:#e6edf3;font-size:.83rem}
        .form-control:focus,.form-select:focus{background:#0d1117;border-color:#58a6ff;color:#e6edf3;box-shadow:0 0 0 .2rem rgba(88,166,255,.25)}
        .form-label{font-size:.78rem;color:#8b949e;font-weight:500;margin-bottom:.25rem}
        .input-group-text{background:#1c2128;border-color:#30363d;color:#8b949e;font-size:.83rem}
        .btn-primary{background:#238636;border-color:#2ea043;font-size:.82rem}
        .btn-primary:hover{background:#2ea043;border-color:#3fb950}
        .btn-outline-secondary{border-color:#30363d;color:#8b949e;font-size:.82rem}
        .btn-outline-secondary:hover{background:#21262d;color:#e6edf3;border-color:#30363d}
        .btn-action{font-size:.75rem;padding:.25rem .55rem}
        .btn-sm{font-size:.78rem}
        .badge-status{font-size:.7rem;padding:.3em .6em;border-radius:4px}
        .status-active,.status-allocated,.status-completed,.status-delivered,.status-pod_confirmed,.status-dispatched,.status-putaway_completed,.status-picked,.status-awarded{background:#1a4a1a;color:#3fb950}
        .status-draft,.status-created,.status-pending,.status-scheduled{background:#1f2937;color:#8b949e}
        .status-submitted,.status-in_transit,.status-picking,.status-assigned,.status-in-transit,.status-open,.status-under_review{background:#1a2e4a;color:#58a6ff}
        .status-cancelled,.status-failed{background:#3a1a1a;color:#f85149}
        .status-packed,.status-manifested,.status-arrived,.status-received{background:#2d1f3d;color:#bc8cff}
        .status-shipped,.status-out_for_delivery{background:#1a3a2a;color:#56d364}
        .page-header{border-bottom:1px solid #30363d;padding-bottom:1rem;margin-bottom:1.5rem}
        .page-header h4{font-weight:700;color:#e6edf3;margin:0}
        .page-header p{color:#8b949e;font-size:.85rem;margin:0}
        .section-divider{border-color:#30363d;margin:1.5rem 0}
        .stat-card{border:1px solid #30363d;border-radius:8px;background:#161b22;padding:1rem 1.25rem}
        .stat-card .stat-value{font-size:1.75rem;font-weight:700;color:#58a6ff}
        .stat-card .stat-label{font-size:.75rem;color:#8b949e;margin-top:.1rem}
        .stat-card .stat-icon{font-size:1.5rem;opacity:.6}
        .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:.78rem;color:#79c0ff}
        .text-muted-sm{font-size:.75rem;color:#8b949e!important}
        .modal-content{background:#161b22;border:1px solid #30363d}
        .modal-header{border-bottom:1px solid #30363d}
        .modal-footer{border-top:1px solid #30363d}
        .modal-title{font-size:.95rem;font-weight:600}
        pre.response-json{background:#0d1117;color:#3fb950;font-size:.75rem;max-height:420px;overflow-y:auto;border-radius:6px;padding:1rem;border:1px solid #30363d}
        #loadingOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center}
        #loadingOverlay.active{display:flex}
        .toast-container{position:fixed;top:1rem;right:1rem;z-index:10000}
        .toast{background:#1c2128;border:1px solid #30363d;color:#e6edf3}
        .toast.success .toast-body{color:#3fb950}
        .toast.error .toast-body{color:#f85149}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:#0d1117}
        ::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
        .empty-state{text-align:center;padding:3rem 1rem;color:#8b949e}
        .empty-state i{font-size:2.5rem;display:block;margin-bottom:.75rem;opacity:.4}
    </style>
</head>
<body th:fragment="navbar(activePage)" style="display:none"><!-- navbar fragment placeholder --></body>
</html>
